apiVersion: apps/v1
kind: Deployment
metadata:
  name: citron-harness
  labels:
    app: citron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: citron
  template:
    metadata:
      labels:
        app: citron
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: citron
        image: your-registry/citron:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "250m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        volumeMounts:
        - name: workdir
          mountPath: /var/citron
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: workdir
        emptyDir:
          sizeLimit: 256Mi
